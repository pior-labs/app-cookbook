name: Deploy Cookbook

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main Cookbook CI run ID (also used to redeploy an older release)
        required: true
        type: string
      ci_run_attempt:
        description: Optional exact CI attempt (leave blank for latest; use the recorded attempt for rollback)
        required: false
        type: string

permissions:
  contents: read
  packages: read
  actions: read

# Every future maintenance workflow that mutates Cookbook production must use
# this same group. In-flight migrations must never be cancelled by a new deploy.
concurrency:
  group: cookbook-production
  cancel-in-progress: false

jobs:
  resolve:
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      attempt: ${{ steps.release.outputs.attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve successful CI release
        id: release
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release.py resolve
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-release
          path: release.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    needs: resolve
    environment: PRODUCTION
    runs-on: [self-hosted, linux, prod]
    timeout-minutes: 20
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      APP_ENV: ${{ secrets.APP_ENV }}
      MCP_HTTP_ENABLED: ${{ vars.COOKBOOK_MCP_HTTP_ENABLED }}
      EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
      EXPECTED_RUN_ID: ${{ inputs.ci_run_id }}
      EXPECTED_ATTEMPT: ${{ needs.resolve.outputs.attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out exact release configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: deployment-release
      - name: Isolate registry credentials
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/cookbook-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull, migrate, start and verify release
        run: python3 scripts/deploy.py
      - name: Remove registry credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/cookbook-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
