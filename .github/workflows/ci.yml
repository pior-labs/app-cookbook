name: Cookbook CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # API integration tests run against a real migrated PostgreSQL database
    # rather than mocked SQL, so migration application is validated in CI too
    # (technical design section 14.2).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cookbook_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  # The browser suite runs separately: it needs a browser download and starts
  # its own API and web servers, and it must not slow the check that gates every
  # push (technical design section 14.3).
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The end-to-end server drops and recreates its own database, so this
      # names the one it must never be.
      # The only variable the end-to-end server needs. It never signs in through
      # central SSO, so none of the OAuth configuration applies; this names the
      # database it must never touch, and it creates its own beside it.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cookbook_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @cookbook/e2e exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:e2e
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e/playwright-report
          retention-days: 7
